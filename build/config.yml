version: '3'
info:
  companyName: nbb2025
  productName: Clipboard Fix
  productIdentifier: com.nbb2025.clipboardfix
  description: Mac 通用剪贴板诊断与修复
  copyright: Copyright 2026 nbb2025
  version: 0.1.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, dist]
    file: [.DS_Store, .gitignore, .gitkeep, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
