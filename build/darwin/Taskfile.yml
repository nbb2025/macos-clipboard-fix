version: '3'
includes:
  common: ../Taskfile.yml
tasks:
  build:
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - go build {{.FLAGS}} -o "{{.OUTPUT}}" .
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
      FLAGS: '{{if eq .DEV "true"}}-buildvcs=false{{else}}-tags production -trimpath -buildvcs=false -ldflags="-s -w"{{end}}'
    env:
      CGO_ENABLED: '1'
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
  build:universal:
    cmds:
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64'
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64'
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
  package:
    deps: [build]
    cmds:
      - task: bundle
  package:universal:
    deps: [build:universal]
    cmds:
      - task: bundle
  bundle:
    cmds:
      - test -n "{{.BIN_DIR}}" && rm -rf -- "{{.BIN_DIR}}/Clipboard Fix.app"
      - mkdir -p "{{.BIN_DIR}}/Clipboard Fix.app/Contents/MacOS" "{{.BIN_DIR}}/Clipboard Fix.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/Clipboard Fix.app/Contents/MacOS/"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/Clipboard Fix.app/Contents/Info.plist"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/Clipboard Fix.app/Contents/Resources/"
      - xattr -cr "{{.BIN_DIR}}/Clipboard Fix.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/Clipboard Fix.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/Clipboard Fix.app"
  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
